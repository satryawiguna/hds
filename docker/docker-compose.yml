version: "3.8"

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: hds-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: hds_db
      MYSQL_USER: hds_user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hds-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: hds-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: hds_user
      DB_PASSWORD: password
      DB_NAME: hds_db
      JWT_SECRET: your-secret-key-change-in-production
      SEED_DB: "false"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hds-network
    command: sh -c "sleep 5 && npx knex migrate:latest --knexfile knexfile.ts && if [ \"$$SEED_DB\" = \"true\" ]; then npx knex seed:run --knexfile knexfile.ts; fi && node apps/api/dist/main.js"

  # Frontend Web
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: hds-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - hds-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hds-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: hds_user
      PMA_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - hds-network

networks:
  hds-network:
    driver: bridge

volumes:
  mysql_data:
